name: Daily Apple Price Update

on:
  schedule:
    # 06:10 Asia/Taipei = 22:10 UTC on the previous day
    - cron: "10 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Fetch daily prices
        run: apple-radar ingest

      - name: Export public snapshot
        run: |
          python scripts/export_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "apple-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest_snapshot.json
          git diff --cached --quiet || git commit -m "data: daily price snapshot"
          git push
